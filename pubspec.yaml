name: laundry_app
description: "A complete Laundry Management System with Customer, Staff, and Admin roles."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1

  # State Management
  provider: ^6.1.2

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Auth
  google_sign_in: ^6.2.1

# Utilities
  camera: ^0.11.0+2
  image: ^4.2.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.4
  http: ^1.3.0
  url_launcher: ^6.3.1
  pdf: ^3.11.3
  printing: ^5.14.2
  qr_flutter: ^4.1.0
  barcode: ^2.2.8
  mobile_scanner: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/splash/
    - assets/icons/
    - assets/fonts/
    - assets/json/
    - localization/

